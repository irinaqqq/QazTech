version: '3.8'

services:
  backend:
    image: irinaqqq/qttech-backend:latest
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.role == worker]

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    deploy:
      placement:
        constraints: [node.role == manager]
